<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(function () {
  const canvas = document.getElementById('v');
  const ctx = canvas.getContext('2d', { alpha: false });
  const video = document.getElementById('cam');
  const coarse = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

  const sprite = document.createElement('canvas');
  (function makeSprite() {
    const s = 96;
    sprite.width = sprite.height = s;
    const g = sprite.getContext('2d');
    const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.08, 'rgba(255,248,240,0.92)');
    rg.addColorStop(0.18, 'rgba(235,220,195,0.42)');
    rg.addColorStop(0.38, 'rgba(200,175,140,0.12)');
    rg.addColorStop(0.62, 'rgba(140,120,90,0.04)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
    g.fill();
  })();

  let W = 0, H = 0, DPR = 1;
  function viewSize() {
    const vv = window.visualViewport;
    return { w: (vv && vv.width) || innerWidth, h: (vv && vv.height) || innerHeight };
  }
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const v = viewSize();
    W = canvas.width = Math.floor(v.w * DPR);
    H = canvas.height = Math.floor(v.h * DPR);
    canvas.style.width = v.w + 'px';
    canvas.style.height = v.h + 'px';
    const vv = window.visualViewport;
    if (vv) canvas.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px)';
  }
  resize();
  window.addEventListener('resize', () => { resize(); if (bots.length) spawn(); });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => { resize(); });
    visualViewport.addEventListener('scroll', resize);
  }

  // —— audio ——
  let ac = null, humOsc = null, humGain = null, noiseBuf = null;
  function audio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function ensureNoise() {
    const a = audio();
    if (noiseBuf) return noiseBuf;
    const n = Math.floor(a.sampleRate * 0.05);
    noiseBuf = a.createBuffer(1, n, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * 0.18));
    return noiseBuf;
  }
  function blip(freq, dur, vol, type) {
    try {
      const a = audio();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) {}
  }
  function thump() {
    try {
      const a = audio();
      const src = a.createBufferSource();
      src.buffer = ensureNoise();
      const f = a.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 240;
      const g = a.createGain();
      g.gain.value = 0.11;
      src.connect(f); f.connect(g); g.connect(a.destination);
      src.start();
      blip(86, 0.07, 0.05, 'sine');
    } catch (e) {}
  }
  function startHum() {
    try {
      const a = audio();
      if (humOsc) return;
      humOsc = a.createOscillator();
      humGain = a.createGain();
      const f = a.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 280;
      humOsc.type = 'sine';
      humOsc.frequency.value = 58;
      humGain.gain.value = 0.0001;
      humOsc.connect(humGain); humGain.connect(f); f.connect(a.destination);
      humOsc.start();
    } catch (e) {}
  }
  function setHum(level) {
    if (!humGain || !ac) return;
    humGain.gain.linearRampToValueAtTime(0.0001 + level * 0.016, ac.currentTime + 0.08);
  }

  let lastVibe = 0;
  const canVibrate = typeof navigator.vibrate === 'function';
  function haptic(ms) {
    const now = performance.now();
    if (now - lastVibe < 80) return;
    lastVibe = now;
    try { if (canVibrate) navigator.vibrate(ms || 16); } catch (e) {}
  }

  const pulses = [];
  let glowCenter = { x: 0, y: 0, w: 0 };

  function ignite(x, y, power) {
    const now = performance.now();
    const pow = power == null ? 1 : power;
    pulses.push({ x: x, y: y, t0: now, pow: pow });
    if (pulses.length > 8) pulses.shift();
    const speed = Math.max(W, H) * 3.4;
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      const d = Math.hypot(b.x - x, b.y - y);
      const at = now + d / speed * 1000;
      if (!b.flashAt || at < b.flashAt) {
        b.flashAt = at;
        b.flashPow = Math.max(b.flashPow || 0, pow * (1.08 - Math.min(0.28, d / (Math.max(W, H) * 1.3))));
      }
    }
    try { setHum(Math.min(1, 0.55 + pow * 0.45)); } catch (e) {}
    blip(220 + pow * 80, 0.16, 0.03, 'sine');
  }

  const SIZE = 6.2;
  const N_MAX = 2600;
  let N = 1600;
  const bots = [];
  let slots = [];

  const TABLE = () => H * 0.72;
  const spacing = () => Math.max(5.5, SIZE * DPR * 0.98);

  function botCount() {
    const v = viewSize();
    const area = (v.w * v.h) / (1280 * 800);
    N = Math.max(700, Math.min(N_MAX, Math.floor(1300 * Math.sqrt(Math.max(0.45, area)))));
  }

  function spawn() {
    bots.length = 0;
    botCount();
    const tableY = TABLE();
    for (let i = 0; i < N; i++) {
      bots.push({
        x: W * 0.5 + (Math.random() - 0.5) * W * 0.92,
        y: H * 0.5 + (Math.random() - 0.5) * H * 0.88,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        glow: 0,
        linked: 0,
        flashAt: 0,
        flashPow: 0,
        phase: Math.random() * Math.PI * 2,
        stiff: 0.026 + Math.random() * 0.034,
        wander: 0.3 + Math.random() * 0.55,
        sz: 0.78 + Math.random() * 0.5
      });
    }
  }

  function rnd(i, k) {
    const x = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function cloud(cx, cy, n, radius, squash) {
    const out = new Array(n);
    const q = squash == null ? 0.92 : squash;
    for (let i = 0; i < n; i++) {
      const u = Math.max(1e-4, rnd(i, 1));
      const v = rnd(i, 2);
      const r = radius * Math.sqrt(-2 * Math.log(u)) * 0.5 * (0.72 + rnd(i, 3) * 0.55);
      const a = v * Math.PI * 2;
      out[i] = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * q };
    }
    return out;
  }

  function sunflower(cx, cy, n, sp, squash) {
    const radius = sp * Math.sqrt(Math.max(1, n)) * 0.95;
    return cloud(cx, cy, n, radius, squash);
  }

  function ribbon(pts, n, sp, width) {
    if (!pts || pts.length < 2) {
      const p = (pts && pts[0]) || { x: W / 2, y: H / 2 };
      return sunflower(p.x, p.y, n, sp);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    }
    const L = cum[cum.length - 1] || 1;
    const out = new Array(n);
    const w = width || sp * 6;
    for (let i = 0; i < n; i++) {
      const t = (i + rnd(i, 31) * 0.88) / n;
      const dist = Math.min(L, Math.max(0, t * L));
      let k = 1;
      while (k < cum.length && cum[k] < dist) k++;
      const i1 = Math.max(1, Math.min(k, cum.length - 1));
      const i0 = i1 - 1;
      const seg = (cum[i1] - cum[i0]) || 1;
      const u = (dist - cum[i0]) / seg;
      const x = pts[i0].x + (pts[i1].x - pts[i0].x) * u;
      const y = pts[i0].y + (pts[i1].y - pts[i0].y) * u;
      const dx = pts[i1].x - pts[i0].x, dy = pts[i1].y - pts[i0].y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const off = (rnd(i, 32) - 0.5) * w * (0.65 + rnd(i, 33) * 0.7);
      out[i] = { x: x + nx * off, y: y + ny * off };
    }
    return out;
  }

  const HAND_CONN = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
  ];
  const FINGERS = [
    [0, 1, 2, 3, 4],
    [0, 5, 6, 7, 8],
    [0, 9, 10, 11, 12],
    [0, 13, 14, 15, 16],
    [0, 17, 18, 19, 20]
  ];

  function palmOf(pts) {
    const idx = [0, 5, 9, 13, 17];
    let x = 0, y = 0;
    for (const i of idx) { x += pts[i].x; y += pts[i].y; }
    return { x: x / idx.length, y: y / idx.length };
  }

  function handSlots(h, n, sp) {
    const pts = h.points;
    if (!pts || pts.length < 21) return sunflower(W / 2, H / 2, n, sp);
    const palm = palmOf(pts);
    h.palm = palm;
    if (h.pinch) return sunflower(palm.x, palm.y, n, sp * 0.88, 0.92);
    const palmN = Math.floor(n * 0.38);
    const rest = n - palmN;
    const per = Math.floor(rest / 5);
    const leftover = rest - per * 5;
    const out = sunflower(palm.x, palm.y, palmN + leftover, sp * 1.02, 0.9);
    const scale = Math.hypot(pts[0].x - pts[9].x, pts[0].y - pts[9].y) || 80;
    const fw = Math.max(sp * 2.6, scale * 0.16);
    for (let f = 0; f < 5; f++) {
      const line = FINGERS[f].map(i => pts[i]);
      out.push.apply(out, ribbon(line, per, sp, fw));
    }
    return out;
  }

  const hands = [];
  const pointers = new Map();
  let mouse = { x: 0, y: 0, down: false, inside: false };
  let mode = 'follow';
  let wavePhase = 0;
  let camOn = false;
  let started = true;
  let awakened = false;
  let gravSX = 0, gravSY = 1; // screen-space gravity in g's (y+ is down the screen)
  let motionOn = false, motionTried = false, motionFromAccel = false;
  let lastLock = 0, prevEnergy = 0;
  let previewT = 0;
  let wasPinch = false;

  function pileSlots(n, sp) {
    const cx = W * 0.5, cy = H * 0.52;
    const rx = W * 0.48, ry = H * 0.4;
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const r = Math.sqrt(rnd(i, 21));
      const a = rnd(i, 22) * Math.PI * 2;
      const jx = 0.72 + rnd(i, 23) * 0.56;
      const jy = 0.72 + rnd(i, 24) * 0.56;
      out[i] = { x: cx + Math.cos(a) * r * rx * jx, y: cy + Math.sin(a) * r * ry * jy };
    }
    return out;
  }

  function waveSlots(n, sp) {
    wavePhase += 0.045;
    const base = H * 0.58;
    const amp = H * 0.13;
    const x1 = W * 0.1, x2 = W * 0.9;
    const steps = 80;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push({
        x: x1 + (x2 - x1) * t,
        y: base + Math.sin(t * Math.PI * 2 - wavePhase) * amp
      });
    }
    return ribbon(pts, n, sp, sp * 12);
  }

  function archBetween(a, b, n, sp, width) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const span = Math.hypot(dx, dy) || 1;
    const lift = Math.min(H * 0.22, span * 0.35);
    const steps = 48;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push({
        x: a.x + dx * t,
        y: a.y + dy * t - Math.sin(t * Math.PI) * lift
      });
    }
    return ribbon(pts, n, sp, width || sp * 6);
  }

  function twoNodeSlots(a, b, n, sp) {
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const pinchT = 90 * DPR;
    const pinched = d < pinchT;
    if (pinched !== wasPinch && pinched) {
      haptic(20);
      thump();
    }
    wasPinch = pinched;
    if (pinched) {
      return sunflower((a.x + b.x) / 2, (a.y + b.y) / 2, n, sp * 0.86, 0.95);
    }
    const each = Math.floor(n * 0.26);
    const mid = n - each * 2;
    return sunflower(a.x, a.y, each, sp)
      .concat(archBetween(a, b, mid, sp, sp * 5.5), sunflower(b.x, b.y, each, sp));
  }

  function bridgeSlots(n, sp) {
    if (hands.length >= 2 && hands[0].points && hands[1].points) {
      const a = palmOf(hands[0].points);
      const b = palmOf(hands[1].points);
      hands[0].palm = a; hands[1].palm = b;
      const handN = Math.floor(n * 0.22);
      const mid = n - handN * 2;
      return handSlots(hands[0], handN, sp)
        .concat(archBetween(a, b, mid, sp, sp * 6), handSlots(hands[1], handN, sp));
    }
    const pts = Array.from(pointers.values());
    if (pts.length >= 2) return twoNodeSlots(pts[0], pts[1], n, sp);
    const x1 = W * 0.16, x2 = W * 0.84;
    const yBase = TABLE() - 8 * DPR;
    let cx, cy;
    if (pts.length === 1) { cx = pts[0].x; cy = Math.min(pts[0].y, yBase - 20 * DPR); }
    else if (mouse.down || mouse.inside) { cx = mouse.x; cy = Math.min(mouse.y, yBase - 20 * DPR); }
    else { cx = W * 0.5; cy = H * 0.34; }
    const steps = 56;
    const line = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, u = 1 - t;
      line.push({
        x: u * u * x1 + 2 * u * t * cx + t * t * x2,
        y: u * u * yBase + 2 * u * t * cy + t * t * yBase
      });
    }
    return ribbon(line, n, sp, sp * 6.5);
  }

  function followSlots(n, sp) {
    if (hands.length >= 2) return twoNodeSlots(palmOf(hands[0].points), palmOf(hands[1].points), n, sp);
    if (hands.length === 1) return handSlots(hands[0], n, sp);
    const pts = Array.from(pointers.values());
    if (pts.length >= 2) return twoNodeSlots(pts[0], pts[1], n, sp);
    if (pts.length === 1) return sunflower(pts[0].x, pts[0].y, n, sp * 0.98, 0.95);
    if (mouse.down) return sunflower(mouse.x, mouse.y, n, sp * 0.98, 0.95);
    return pileSlots(n, sp);
  }

  function rebuildSlots() {
    const n = bots.length;
    const sp = spacing();
    if (!started) {
      const breath = 1 + Math.sin(previewT / 1100) * 0.07;
      const cx = W * 0.5 + Math.sin(previewT / 1800) * W * 0.03;
      const cy = H * 0.58;
      slots = cloud(cx, cy, n, Math.min(W, H) * 0.3 * breath, 0.84);
      return;
    }
    if (pointers.size >= 3) mode = 'wave';
    else if (mode === 'wave' && pointers.size === 0 && hands.length < 2) mode = 'follow';
    if (mode === 'wave') slots = waveSlots(n, sp);
    else if (mode === 'bridge') slots = bridgeSlots(n, sp);
    else slots = followSlots(n, sp);
  }

  let cell = 16, grid = new Map();
  function key(cx, cy) { return (cx << 16) ^ (cy & 0xffff); }
  function hash() {
    grid.clear();
    cell = Math.max(11, spacing() * 2.1);
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      const cx = Math.floor(b.x / cell), cy = Math.floor(b.y / cell);
      const k = key(cx, cy);
      let arr = grid.get(k);
      if (!arr) { arr = []; grid.set(k, arr); }
      arr.push(i);
    }
  }

  function wells() {
    const list = [];
    for (const p of pointers.values()) list.push(p);
    if (!list.length && mouse.down) list.push(mouse);
    for (let i = 0; i < hands.length; i++) {
      if (hands[i].points) list.push(palmOf(hands[i].points));
    }
    return list;
  }

  function step() {
    previewT = performance.now();
    if (!awakened || !bots.length) return;
    hash();
    const sp = spacing();
    const sepR = Math.max(9.2, sp * 1.55);
    const sepR2 = sepR * sepR;
    const attractR = cell * 2.6;
    const attractR2 = attractR * attractR;
    const m = 10 * DPR;
    const gWorld = 0.13 * DPR;
    const gax = gWorld * gravSX;
    const gay = gWorld * gravSY;
    const touches = wells();
    const holding = touches.length > 0;
    const glowR = 220 * DPR;
    const eps = 108 * DPR;
    const eps2 = eps * eps;
    // modest well: loose cloud around the finger, not a collapse
    const wellK = (holding ? 260 : 0) * DPR;
    const curl = 0.11;
    let energy = 0, locked = 0;
    let gx = 0, gy = 0, gw = 0;
    const Gmut = 0.35 * DPR;

    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      let ax = gax, ay = gay;

      for (let ti = 0; ti < touches.length; ti++) {
        const p = touches[ti];
        const dx = p.x - b.x, dy = p.y - b.y;
        const d2 = dx * dx + dy * dy;
        const inv = wellK / (d2 + eps2);
        ax += dx * inv;
        ay += dy * inv;
        // slight swirl so they circle the finger instead of slamming in
        const s = curl * inv;
        ax += -dy * s;
        ay += dx * s;
      }

      const cx = Math.floor(b.x / cell), cy = Math.floor(b.y / cell);
      let links = 0;
      for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
        const arr = grid.get(key(cx + ox, cy + oy));
        if (!arr) continue;
        for (let k = 0; k < arr.length; k++) {
          const o = bots[arr[k]];
          if (o === b) continue;
          const dx = o.x - b.x, dy = o.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 0.25) continue;
          if (d2 < sepR2) {
            const d = Math.sqrt(d2);
            const f = (sepR - d) / sepR;
            ax -= (dx / d) * f * 1.15;
            ay -= (dy / d) * f * 1.15;
            links++;
          } else if (d2 < attractR2) {
            const inv = Gmut / (d2 + 280);
            ax += dx * inv;
            ay += dy * inv;
            if (d2 < attractR2 * 0.45) links++;
          }
        }
      }
      b.linked += ((links > 2 ? 1 : 0) - b.linked) * 0.16;
      if (b.linked > 0.6) locked++;

      const pad = 26 * DPR;
      if (b.x < m + pad && gravSX < -0.12) { ax += (m + pad - b.x) * 0.08; b.vx *= 0.88; }
      if (b.x > W - m - pad && gravSX > 0.12) { ax -= (b.x - (W - m - pad)) * 0.08; b.vx *= 0.88; }
      if (b.y < m + pad && gravSY < -0.12) { ay += (m + pad - b.y) * 0.08; b.vy *= 0.88; }
      if (b.y > H - m - pad && gravSY > 0.12) { ay -= (b.y - (H - m - pad)) * 0.08; b.vy *= 0.88; }

      const damp = holding ? 0.988 : 0.995;
      b.vx = (b.vx + ax) * damp;
      b.vy = (b.vy + ay) * damp;
      const sped = Math.hypot(b.vx, b.vy);
      const maxs = 13 * DPR;
      if (sped > maxs) { b.vx *= maxs / sped; b.vy *= maxs / sped; }
      b.x += b.vx;
      b.y += b.vy;
      energy += sped;

      if (b.x < m) { b.x = m; b.vx = Math.abs(b.vx) * (gravSX < -0.15 ? 0.08 : 0.3); }
      if (b.x > W - m) { b.x = W - m; b.vx = -Math.abs(b.vx) * (gravSX > 0.15 ? 0.08 : 0.3); }
      if (b.y < m) { b.y = m; b.vy = Math.abs(b.vy) * (gravSY < -0.15 ? 0.08 : 0.28); }
      if (b.y > H - m) { b.y = H - m; b.vy = -Math.abs(b.vy) * (gravSY > 0.15 ? 0.08 : 0.28); }

      if (b.flashAt && previewT >= b.flashAt) {
        b.glow = Math.max(b.glow, b.flashPow || 1);
        b.flashAt = 0;
        b.flashPow = 0;
      } else {
        let want = 0.1 + 0.06 * (0.5 + 0.5 * Math.sin(previewT * 0.0018 + (b.phase || 0)));
        if (sped > 0.7 * DPR) want = Math.max(want, Math.min(0.75, 0.14 + sped / (9 * DPR)));
        if (holding) {
          for (let ti = 0; ti < touches.length; ti++) {
            const p = touches[ti];
            const dd = Math.hypot(b.x - p.x, b.y - p.y);
            if (dd < glowR) {
              const falloff = 1 - dd / glowR;
              const tw = 0.55 + 0.35 * (0.5 + 0.5 * Math.sin((b.phase || 0) * 2));
              want = Math.max(want, 0.78 * falloff * falloff * tw);
            }
          }
        }
        if (b.glow > want) b.glow += (want - b.glow) * 0.045;
        else b.glow += (want - b.glow) * 0.32;
      }
      if (b.glow > 0.1) {
        gx += b.x * b.glow;
        gy += b.y * b.glow;
        gw += b.glow;
      }
    }
    glowCenter = gw > 0.01 ? { x: gx / gw, y: gy / gw, w: gw / bots.length } : { x: W * 0.5, y: H * 0.5, w: 0 };

    const e = energy / Math.max(1, bots.length);
    setHum(Math.min(1, e / (8 * DPR) + (holding ? 0.18 : 0)));
    const lockRatio = locked / Math.max(1, bots.length);
    if (lockRatio > 0.35 && prevEnergy > e * 1.2 && performance.now() - lastLock > 500) {
      lastLock = performance.now();
      haptic(18);
      blip(150, 0.1, 0.02, 'sine');
    }
    prevEnergy = e;
  }

  function bg() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function drawLights() {
    const now = previewT || performance.now();
    if (glowCenter.w > 0.1) {
      const rad = (50 + glowCenter.w * 180) * DPR;
      const a = Math.min(0.12, glowCenter.w * 0.32);
      const lg = ctx.createRadialGradient(glowCenter.x, glowCenter.y, 0, glowCenter.x, glowCenter.y, rad);
      lg.addColorStop(0, 'rgba(255, 236, 214,' + a + ')');
      lg.addColorStop(0.45, 'rgba(210, 180, 140,' + (a * 0.22) + ')');
      lg.addColorStop(1, 'rgba(160, 130, 90, 0)');
      ctx.fillStyle = lg;
      ctx.fillRect(glowCenter.x - rad, glowCenter.y - rad, rad * 2, rad * 2);
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const age = now - p.t0;
      if (age > 1100) { pulses.splice(i, 1); continue; }
      const tt = age / 1100;
      const rad = (28 + tt * 260) * DPR * (0.85 + p.pow * 0.2);
      const a = (1 - tt) * 0.32 * p.pow;
      const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      rg.addColorStop(0, 'rgba(255, 248, 236,' + a + ')');
      rg.addColorStop(0.35, 'rgba(230, 200, 160,' + (a * 0.35) + ')');
      rg.addColorStop(1, 'rgba(180, 150, 110, 0)');
      ctx.fillStyle = rg;
      ctx.fillRect(p.x - rad, p.y - rad, rad * 2, rad * 2);
    }
  }

  function drawBots() {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      const g = b.glow;
      if (g < 0.02) continue;
      const size = (2.2 + (b.sz || 1) * 1.35 + g * 5.5) * DPR;
      ctx.globalAlpha = Math.min(1, 0.08 + g * 0.92);
      ctx.drawImage(sprite, b.x - size * 0.5, b.y - size * 0.5, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawCursors() {
    const pts = Array.from(pointers.values());
    const list = pts.length ? pts : ((mouse.inside || mouse.down) && !coarse ? [mouse] : []);
    for (const p of list) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, ((mouse.down || pts.length) ? 16 : 9) * DPR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(62,224,210,0.85)';
      ctx.lineWidth = 1.5 * DPR;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.1 * DPR, 0, Math.PI * 2);
      ctx.fillStyle = '#3ee0d2';
      ctx.fill();
    }
    if (!hands.length) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const h of hands) {
      const hp = h.points;
      if (!hp) continue;
      ctx.strokeStyle = h.pinch ? 'rgba(255,107,154,0.75)' : 'rgba(62,224,210,0.5)';
      ctx.lineWidth = 2.2 * DPR;
      ctx.beginPath();
      for (const pair of HAND_CONN) {
        const a = hp[pair[0]], b = hp[pair[1]];
        if (!a || !b) continue;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      }
      ctx.stroke();
    }
  }

  function frame(now) {
    if (!awakened) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      requestAnimationFrame(frame);
      return;
    }
    if (!bots.length) spawn();
    step();
    bg();
    drawLights();
    drawBots();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function ptr(e) { return { x: e.clientX * DPR, y: e.clientY * DPR }; }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const p = ptr(e);
    pointers.set(e.pointerId, p);
    mouse.x = p.x; mouse.y = p.y; mouse.down = true; mouse.inside = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (!awakened) {
      awakened = true;
      spawn();
    }
    haptic(12);
    thump();
    startHum();
    ignite(p.x, p.y, 1);
    // Motion is requested on pointerup/click (iOS: touch pointerdown is not
    // a user activation). Camera starts on a later tap so its dialog does not
    // swallow the motion permission.
    if (motionTried && !camOn) {
      camTried = true;
      startCamera();
    }
  }, { passive: false });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptr(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
    mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  });
  function ptrEnd(e) {
    pointers.delete(e.pointerId);
    mouse.down = pointers.size > 0;
    if (!pointers.size) wasPinch = false;
  }
  canvas.addEventListener('pointerup', ptrEnd);
  canvas.addEventListener('pointercancel', ptrEnd);
  canvas.addEventListener('pointerleave', (e) => {
    if (!pointers.has(e.pointerId)) mouse.inside = false;
  });
  function preventScroll(e) { e.preventDefault(); }

  function setMode(m) {
    mode = m;
    blip(m === 'wave' ? 280 : m === 'bridge' ? 210 : 240, 0.07, 0.03);
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') setMode('follow');
    if (e.key === '2') setMode('wave');
    if (e.key === '3') setMode('bridge');
  });

  function setCam() {}
  function setHap() {}
  let camTried = false;

  function pinchOf(lm) {
    const a = lm[4], b = lm[8];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function mapLm(lm) {
    return lm.map(p => ({
      x: (1 - p.x) * W,
      y: p.y * H * 0.92 + H * 0.02
    }));
  }
  function drawMiniHands(landmarks) {
    const w = overlay.width, h = overlay.height;
    octx.clearRect(0, 0, w, h);
    octx.strokeStyle = '#3ee0d2';
    octx.fillStyle = '#ff6b9a';
    octx.lineWidth = 2;
    octx.lineCap = 'round';
    for (const lm of landmarks) {
      octx.beginPath();
      for (const pair of HAND_CONN) {
        const a = lm[pair[0]], b = lm[pair[1]];
        octx.moveTo(a.x * w, a.y * h);
        octx.lineTo(b.x * w, b.y * h);
      }
      octx.stroke();
      for (let i = 0; i < lm.length; i++) {
        octx.beginPath();
        octx.arc(lm[i].x * w, lm[i].y * h, 2, 0, Math.PI * 2);
        octx.fill();
      }
    }
  }

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return window.orientation;
    return 0;
  }

  function applyDeviceG(ax, ay) {
    const ang = screenAngle();
    let x = ax, y = ay;
    if (ang === 90) { x = -ay; y = ax; }
    else if (ang === -90 || ang === 270) { x = ay; y = -ax; }
    else if (ang === 180) { x = -ax; y = -ay; }
    // Apple device: +x right, +y toward top. Canvas: +y down.
    let tx = x / 9.81;
    let ty = -y / 9.81;
    const mag = Math.hypot(tx, ty);
    if (mag > 2.4) { tx *= 2.4 / mag; ty *= 2.4 / mag; }
    const k = 0.22;
    gravSX += (tx - gravSX) * k;
    gravSY += (ty - gravSY) * k;
  }

  function onDeviceMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null) return;
    motionFromAccel = true;
    applyDeviceG(a.x, a.y);
  }

  function onDeviceOrient(e) {
    if (motionFromAccel) return;
    if (e.beta == null || e.gamma == null) return;
    // beta: 0 flat, 90 upright; gamma: right positive. Approx gravity on screen, in m/s^2.
    const br = e.beta * Math.PI / 180;
    const gr = e.gamma * Math.PI / 180;
    const ax = Math.sin(gr) * 9.81;
    const ay = -Math.sin(br) * Math.cos(gr) * 9.81;
    applyDeviceG(ax, ay);
  }

  function attachMotion() {
    if (motionOn) return;
    window.addEventListener('devicemotion', onDeviceMotion, true);
    window.addEventListener('deviceorientation', onDeviceOrient, true);
    motionOn = true;
    motionTried = true;
  }

  // iOS Safari only reliably shows the system dialog from a real <button> click,
  // and requestPermission() must be the first thing in that click call stack.
  const arm = document.getElementById('arm');
  if (arm) {
    arm.addEventListener('click', function (ev) {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (s) {
            motionTried = true;
            if (s === 'granted') attachMotion();
          }).catch(function () { motionTried = true; });
        } else if (typeof DeviceMotionEvent !== 'undefined' &&
                   typeof DeviceMotionEvent.requestPermission === 'function') {
          DeviceMotionEvent.requestPermission().then(function (s) {
            motionTried = true;
            if (s === 'granted') attachMotion();
          }).catch(function () { motionTried = true; });
        } else {
          attachMotion();
        }
      } catch (err) {
        attachMotion();
      }

      const x = (ev.clientX || (window.innerWidth / 2)) * DPR;
      const y = (ev.clientY || (window.innerHeight / 2)) * DPR;
      if (!awakened) { awakened = true; spawn(); }
      mouse.x = x; mouse.y = y; mouse.down = true; mouse.inside = true;
      haptic(12);
      thump();
      startHum();
      ignite(x, y, 1);
      arm.remove();
      document.documentElement.classList.add('play');
      document.addEventListener('touchmove', preventScroll, { passive: false });
      setTimeout(function () { mouse.down = false; }, 80);
    }, { once: true });
  }

  function startMotion() {
    // Kept as a no-op fallback name; permission is requested from #arm click.
    if (motionOn) return;
    if (typeof DeviceOrientationEvent === 'undefined' ||
        typeof DeviceOrientationEvent.requestPermission !== 'function') {
      attachMotion();
    }
  }

  async function startCamera() {
    if (camOn) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
    } catch (err) {
      return;
    }
    try {
      video.srcObject = stream;
      await video.play();
      if (typeof Hands === 'undefined') return;
      const handsMp = new Hands({
        locateFile: (f) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f
      });
      handsMp.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });
      handsMp.onResults((res) => {
        const lms = res.multiHandLandmarks || [];
        if (lms.length) {
          const next = lms.map(lm => {
            const pts = mapLm(lm);
            const p = pinchOf(lm);
            return { points: pts, pinch: p < 0.07, open: p > 0.16 };
          });
          for (let i = 0; i < next.length; i++) {
            if (next[i].pinch && !(hands[i] && hands[i].pinch)) {
              haptic(18);
              thump();
              const pl = palmOf(next[i].points);
              ignite(pl.x, pl.y, 1.05);
            }
          }
          hands.splice(0, hands.length, ...next);
        } else {
          hands.length = 0;
        }
      });
      if (typeof Camera === 'undefined') {
        const loop = async () => {
          if (video.readyState >= 2) await handsMp.send({ image: video });
          requestAnimationFrame(loop);
        };
        loop();
      } else {
        const camera = new Camera(video, {
          onFrame: async () => { await handsMp.send({ image: video }); },
          width: 640,
          height: 480
        });
        camera.start();
      }
      camOn = true;
    } catch (err) {
      try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
    }
  }

})();
</script>
</body>
</html>
